# =====================================================================
# spark-defaults.conf
# Di-mount ke /opt/spark/conf/spark-defaults.conf pada spark-master &
# spark-worker. Mengatur integrasi Hive, lokasi warehouse di HDFS, dan
# parameter sumber daya default.
# =====================================================================

# --- Integrasi Hive / Catalog ---
spark.sql.catalogImplementation        hive
spark.sql.warehouse.dir                 hdfs://namenode:9000/user/hive/warehouse

# --- Filesystem default ---
spark.hadoop.fs.defaultFS               hdfs://namenode:9000

# --- Event log (untuk History Server / Spark UI yang persisten) ---
spark.eventLog.enabled                  true
spark.eventLog.dir                      hdfs://namenode:9000/spark-logs
spark.history.fs.logDirectory           hdfs://namenode:9000/spark-logs

# --- Sumber daya default (sesuaikan dengan kapasitas Docker Desktop) ---
spark.driver.memory                     1g
spark.executor.memory                   1500m
spark.executor.cores                    2

# --- Serializer & shuffle ---
spark.serializer                        org.apache.spark.serializer.KryoSerializer
spark.sql.shuffle.partitions            8

# --- Arrow untuk konversi cepat ke/dari pandas ---
spark.sql.execution.arrow.pyspark.enabled   true
